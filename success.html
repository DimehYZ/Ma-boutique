<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medah Shop — Commande confirmée 🎉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink:   #FF0B8C;
      --magenta:#C024C8;
      --purple: #7B2FD5;
      --blue:   #2B6EFF;
      --cyan:   #00C6FF;
      --white:  #FFFFFF;
      --off:    #F8F5FF;
      --dark:   #120B2E;
      --mid:    #6B7280;
      --grad: linear-gradient(135deg, var(--pink) 0%, var(--purple) 50%, var(--blue) 100%);
      --grad-h: linear-gradient(135deg, var(--pink) 0%, var(--magenta) 40%, var(--blue) 100%);
      --grad-soft: linear-gradient(135deg, #FFD6F0 0%, #E8D5FF 50%, #D0E4FF 100%);
      --font-display: 'Fredoka', sans-serif;
      --font-body:    'Nunito', sans-serif;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--off);
      color: var(--dark);
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Orbs bg ── */
    .bg-orbs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18;
      animation: drift 8s ease-in-out infinite alternate;
    }
    .orb1 { width: 500px; height: 500px; background: var(--pink); top: -150px; right: -100px; animation-delay: 0s; }
    .orb2 { width: 400px; height: 400px; background: var(--purple); bottom: -100px; left: -80px; animation-delay: -3s; }
    .orb3 { width: 300px; height: 300px; background: var(--blue); top: 40%; left: 40%; animation-delay: -5s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 64px;
      background: rgba(248, 245, 255, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(123, 47, 213, 0.12);
    }
    .nav-logo {
      font-family: var(--font-display); font-size: 1.4rem; font-weight: 700;
      background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; text-decoration: none;
    }

    /* ── Main ── */
    main {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 100px 1.5rem 4rem;
    }

    .success-wrap {
      width: 100%; max-width: 560px;
      display: flex; flex-direction: column; gap: 1.25rem;
    }

    /* ── Confetti burst ── */
    .confetti-ring {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: var(--grad);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto;
      font-size: 2.8rem;
      box-shadow: 0 0 0 0 rgba(255, 11, 140, 0.4);
      animation: popIn 0.6s var(--spring) both, pulse-ring 2s ease-out 0.8s infinite;
      position: relative;
    }
    .confetti-ring::before {
      content: '';
      position: absolute; inset: -8px; border-radius: 50%;
      border: 2px solid rgba(255, 11, 140, 0.3);
      animation: ring-expand 1.5s ease-out 0.6s infinite;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.3) rotate(-10deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(123, 47, 213, 0.35); }
      70%  { box-shadow: 0 0 0 20px rgba(123, 47, 213, 0); }
      100% { box-shadow: 0 0 0 0 rgba(123, 47, 213, 0); }
    }
    @keyframes ring-expand {
      from { transform: scale(1); opacity: 0.6; }
      to   { transform: scale(1.6); opacity: 0; }
    }

    /* ── Card ── */
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(123, 47, 213, 0.12);
      box-shadow: 0 20px 60px rgba(123, 47, 213, 0.10), 0 4px 16px rgba(0,0,0,0.04);
      padding: 2.5rem 2rem;
      animation: slideUp 0.7s var(--spring) both;
    }
    .card:nth-child(3) { animation-delay: 0.1s; }
    .card:nth-child(4) { animation-delay: 0.2s; }
    .card:nth-child(5) { animation-delay: 0.3s; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Hero card ── */
    .hero-card { text-align: center; padding-top: 0.5rem; }
    .success-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, #FFD6F0, #E8D5FF);
      color: var(--purple);
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 5px 14px; border-radius: 100px; margin-bottom: 1rem;
    }
    .success-tag::before { content: '✓'; font-size: 13px; }
    .success-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 700; line-height: 1.1;
      color: var(--dark); margin-bottom: 0.75rem;
    }
    .success-title .grad-text {
      background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .success-sub {
      font-size: 14px; color: var(--mid); line-height: 1.8; max-width: 360px; margin: 0 auto;
    }

    /* ── Section title ── */
    .section-label {
      font-family: var(--font-display);
      font-size: 1rem; font-weight: 700;
      color: var(--dark); margin-bottom: 1rem;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label span { font-size: 1.1rem; }

    /* ── Order details ── */
    .order-rows { display: flex; flex-direction: column; gap: 0; }
    .order-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid rgba(123, 47, 213, 0.07);
      font-size: 14px;
    }
    .order-row:last-child { border-bottom: none; }
    .order-label { color: var(--mid); font-weight: 500; }
    .order-val { color: var(--dark); font-weight: 600; text-align: right; max-width: 220px; }
    .order-val.total {
      font-family: var(--font-display); font-size: 1.1rem;
      background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* ── Products list ── */
    .product-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .product-line {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.85rem 1rem;
      background: var(--grad-soft);
      border-radius: 14px;
    }
    .product-emoji { font-size: 2rem; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .product-info { flex: 1; }
    .product-name { font-family: var(--font-display); font-size: 0.95rem; font-weight: 600; color: var(--dark); }
    .product-meta { font-size: 12px; color: var(--mid); }
    .product-price { font-family: var(--font-display); font-weight: 700; font-size: 1rem; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; flex-shrink: 0; }

    /* ── Shipping badge ── */
    .shipping-badge {
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg, #FFD6F0 0%, #E8D5FF 50%, #D0E4FF 100%);
      border-radius: 16px; padding: 1rem 1.25rem;
    }
    .shipping-icon { font-size: 2rem; flex-shrink: 0; }
    .shipping-text strong { display: block; font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--dark); }
    .shipping-text span { font-size: 13px; color: var(--mid); }

    /* ── Steps ── */
    .steps { display: flex; flex-direction: column; gap: 0.75rem; }
    .step {
      display: flex; align-items: flex-start; gap: 12px;
      font-size: 14px; color: var(--mid);
    }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: var(--grad); color: #fff;
      font-family: var(--font-display); font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
    }
    .step strong { color: var(--dark); font-weight: 700; display: block; margin-bottom: 1px; }

    /* ── CTA ── */
    .cta-wrap { display: flex; gap: 1rem; flex-direction: column; }
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--grad); color: #fff; border: none;
      font-family: var(--font-display); font-size: 1.05rem; font-weight: 600;
      padding: 1rem 2rem; border-radius: 14px; cursor: pointer; text-decoration: none;
      transition: filter 0.2s, transform 0.2s;
      box-shadow: 0 8px 28px rgba(123, 47, 213, 0.35);
    }
    .btn-primary:hover { filter: brightness(1.08); transform: translateY(-2px); }
    .btn-secondary {
      display: flex; align-items: center; justify-content: center;
      background: var(--white); color: var(--purple); border: 1.5px solid rgba(123, 47, 213, 0.25);
      font-family: var(--font-display); font-size: 0.95rem; font-weight: 600;
      padding: 0.85rem 2rem; border-radius: 14px; cursor: pointer; text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-secondary:hover { border-color: var(--purple); background: var(--off); }

    /* ── Loading state ── */
    .loading-card {
      text-align: center; padding: 3rem 2rem;
      animation: slideUp 0.5s var(--spring) both;
    }
    .loading-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 1.5rem; }
    .dot {
      width: 12px; height: 12px; border-radius: 50%; background: var(--grad);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    .loading-text { font-family: var(--font-display); font-size: 1.1rem; color: var(--mid); }

    /* ── Floating emojis ── */
    .floaties { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .floatie {
      position: absolute; font-size: 1.5rem; opacity: 0;
      animation: floatUp 4s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(0) scale(0.5) rotate(0deg); }
      20%  { opacity: 0.7; transform: translateY(-60px) scale(1) rotate(15deg); }
      100% { opacity: 0; transform: translateY(-200px) scale(0.8) rotate(30deg); }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      nav { padding: 0 1rem; }
      main { padding: 80px 1rem 3rem; }
      .card { padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div class="floaties" id="floaties"></div>

<nav>
  <a href="/" class="nav-logo">Medah Shop</a>
</nav>

<main>
  <div class="success-wrap" id="mainWrap">

    <!-- Loading state -->
    <div class="card loading-card" id="loadingCard">
      <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <p class="loading-text">Confirmation en cours...</p>
    </div>

  </div>
</main>

<script>
  // ── Floating emojis burst ──────────────────────────────
  const emojis = ['🎉', '✨', '🛍️', '💜', '🎊', '⭐', '💫', '🥳'];
  function launchFloaties() {
    const container = document.getElementById('floaties');
    for (let i = 0; i < 14; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'floatie';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 90 + 5 + 'vw';
        el.style.bottom = Math.random() * 30 + '%';
        el.style.animationDelay = '0s';
        el.style.fontSize = (1.2 + Math.random() * 1.2) + 'rem';
        container.appendChild(el);
        setTimeout(() => el.remove(), 4200);
      }, i * 120);
    }
  }

  // ── Parse Stripe session from URL ─────────────────────
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');

  // ── Render the success UI ──────────────────────────────
  function renderSuccess(order) {
    launchFloaties();
    const wrap = document.getElementById('mainWrap');

    // Products HTML
    const productIcons = ['👗','👕','👖','👟','👜','🧥','👔','🧣'];
    const productsHTML = (order.products || []).map((p, i) => `
      <div class="product-line">
        <div class="product-emoji">${productIcons[i % productIcons.length]}</div>
        <div class="product-info">
          <div class="product-name">${escHtml(p.name)}</div>
          <div class="product-meta">Taille ${escHtml(p.size || '—')} · Qté ${p.qty || 1}</div>
        </div>
        <div class="product-price">${((p.price || 0) * (p.qty || 1)).toFixed(2)}€</div>
      </div>
    `).join('');

    // Shipping mode
    const shippingLabel = order.shippingMode === 'relay'
      ? '📦 Livraison en point relais'
      : '🚪 Livraison à domicile';
    const shippingEta = '9 à 15 jours ouvrés';

    wrap.innerHTML = `
      <!-- Icon -->
      <div class="confetti-ring" style="opacity:0;animation:popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.15s both;">🎉</div>

      <!-- Hero card -->
      <div class="card hero-card">
        <div class="success-tag">Paiement validé</div>
        <h1 class="success-title">Ta commande est <span class="grad-text">confirmée !</span></h1>
        <p class="success-sub">
          Merci pour ta confiance 💜 Un email de confirmation t'a été envoyé.
          Ton colis est entre de bonnes mains !
        </p>
      </div>

      <!-- Commande récap -->
      <div class="card">
        <div class="section-label"><span>📋</span> Récapitulatif</div>
        <div class="order-rows">
          ${order.orderId ? `<div class="order-row"><span class="order-label">N° commande</span><span class="order-val">#${escHtml(order.orderId.slice(-8).toUpperCase())}</span></div>` : ''}
          ${order.customerName ? `<div class="order-row"><span class="order-label">Client</span><span class="order-val">${escHtml(order.customerName)}</span></div>` : ''}
          ${order.customerEmail ? `<div class="order-row"><span class="order-label">Email</span><span class="order-val">${escHtml(order.customerEmail)}</span></div>` : ''}
          ${order.date ? `<div class="order-row"><span class="order-label">Date</span><span class="order-val">${order.date}</span></div>` : ''}
          <div class="order-row"><span class="order-label">Total payé</span><span class="order-val total">${order.total ? order.total.toFixed(2) + '€' : '—'}</span></div>
        </div>
      </div>

      ${productsHTML ? `
      <!-- Articles -->
      <div class="card">
        <div class="section-label"><span>🛍️</span> Tes articles</div>
        <div class="product-list">${productsHTML}</div>
      </div>` : ''}

      <!-- Livraison -->
      <div class="card">
        <div class="section-label"><span>🚚</span> Livraison</div>
        <div class="shipping-badge" style="margin-bottom:1rem;">
          <div class="shipping-icon">${order.shippingMode === 'relay' ? '📦' : '🏠'}</div>
          <div class="shipping-text">
            <strong>${shippingLabel.replace(/^[^ ]+ /, '')}</strong>
            <span>Délai estimé : ${shippingEta}</span>
          </div>
        </div>
        ${order.shippingAddress ? `
        <div class="order-rows">
          <div class="order-row"><span class="order-label">Adresse</span><span class="order-val">${escHtml(order.shippingAddress)}</span></div>
        </div>` : ''}
      </div>

      <!-- Prochaines étapes -->
      <div class="card">
        <div class="section-label"><span>✅</span> Et maintenant ?</div>
        <div class="steps">
          <div class="step"><div class="step-num">1</div><div><strong>Email de confirmation</strong>Vérifie ta boîte mail — tu as reçu le détail complet de ta commande.</div></div>
          <div class="step"><div class="step-num">2</div><div><strong>Préparation du colis</strong>On prépare ton colis avec soin et amour 💜</div></div>
          <div class="step"><div class="step-num">3</div><div><strong>Expédition & suivi</strong>Tu recevras un email avec ton lien de suivi dès l'expédition.</div></div>
          <div class="step"><div class="step-num">4</div><div><strong>Livraison dans 9-15 jours</strong>Ton colis arrive chez toi ou en point relais !</div></div>
        </div>
      </div>

      <!-- CTA -->
      <div class="card">
        <div class="cta-wrap">
          <a href="/" class="btn-primary">🛍️ Continuer mes achats</a>
          <a href="/#contact" class="btn-secondary">Une question ? Contacte-nous</a>
        </div>
      </div>
    `;
  }

  // ── Fallback render (no session_id) ───────────────────
  function renderBasic() {
    const now = new Date();
    renderSuccess({
      orderId: 'MEDAH' + Date.now(),
      date: now.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }),
      total: null,
      products: [],
      shippingMode: 'home',
    });
  }

  // ── Fetch session details if session_id present ────────
  async function init() {
    if (!sessionId) {
      renderBasic();
      return;
    }
    try {
      const res = await fetch('/get-session?session_id=' + encodeURIComponent(sessionId));
      if (res.ok) {
        const data = await res.json();
        renderSuccess(data);
      } else {
        renderBasic();
      }
    } catch {
      renderBasic();
    }
  }

  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
